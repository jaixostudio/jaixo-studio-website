spring.application.name=jaixo-studio-backend
server.port=${PORT:8082}

# MySQL DataSource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jaixo_studio?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:jai.ias.1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Multipart / File Uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads

# JWT Security
app.jwt.secret=${JWT_SECRET:jaixostudio_super_secret_jwt_key_2026_modern_enterprise_fullstack_spring_security_key_0123456789}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.jaixostudio.backend=INFO
logging.level.org.springframework.security=WARN
